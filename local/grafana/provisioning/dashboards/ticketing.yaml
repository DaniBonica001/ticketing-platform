# Mounted at /otel-lgtm/grafana/conf/provisioning/dashboards/ticketing.yaml, next to the image's
# own provider file, so the built-in RED/JVM dashboards keep working.
apiVersion: 1

providers:
  - name: "Ticketing"
    folder: "Ticketing"
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /otel-lgtm/ticketing-dashboards
      foldersFromFilesStructure: false
